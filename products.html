<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>드레스 — LUMINO</title><meta name="description" content="LUMINO의 드레스 대여와 굿즈 컬렉션을 만나보세요." />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" /><link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="lumino.css">
</head>
<body class="lumino-site legacy-page">
  <a class="skip-link" href="#main">본문으로 바로가기</a>
  <header class="lumino-header" data-shared-header></header>
  <main id="main">
    <section class="page-head products-head"><div><p class="eyebrow">THE DRESS LOUNGE</p><h1>입는 순간,<br />오늘이 이야기가 되는 드레스.</h1><p>드레스 대여 · 굿즈 판매</p></div><div class="dress-fan"><img src="images/layover-pink-front.jpg" alt="핑크 드레스" /><img src="images/layover-lavender.jpg" alt="라벤더 드레스" /></div></section>
    <div class="cloud-divider" aria-hidden="true"></div>
    <section class="collection-note"><span aria-hidden="true">♡</span><p>루미노의 온라인 클로젯입니다. 제품을 누르면 자세한 소개와 문의 방법을 확인할 수 있어요.</p><span aria-hidden="true">♡</span></section>
    <section class="section product-list-section">
      <header class="section-heading"><div><p class="eyebrow">ONLINE CLOSET</p><h2>오늘의 옷장</h2></div><p class="section-aside">좋아하는 컬러와 디테일로<br />당신만의 장면을 만들어보세요.</p></header>
      <div class="grid" id="product-list" aria-live="polite"><p class="portfolio-status">드레스를 불러오는 중입니다.</p></div>
    </section>
  </main>
  <footer class="lumino-footer" data-shared-footer></footer>
  <script src="script.js"></script><script src="catalog.js?v=20260826-rich-editor-1"></script>
  <script>
    ProductCatalog.loadVisibleProducts().then((products) => {
      const box = document.getElementById("product-list");
      if (!products.length) { box.innerHTML = '<p class="portfolio-status">아직 공개된 드레스가 없어요. 곧 만나요!</p>'; return; }
      box.innerHTML = products.map((p) => {
        const image = ProductCatalog.safeImageUrl(p.images && p.images[0]);
        const img = image ? '<img src="' + ProductCatalog.escapeHtml(image) + '" alt="' + ProductCatalog.escapeHtml(p.name) + '" loading="lazy" onerror="this.remove()" />' : '';
        const price = p.price ? '<p class="price">' + ProductCatalog.escapeHtml(p.price) + '</p>' : '';
        return '<a class="card" href="product.html?id=' + encodeURIComponent(p.id) + '"><div class="card-img">' + img + '</div><p class="k">' + ProductCatalog.escapeHtml(p.label || p.category || '') + '</p><h3>' + ProductCatalog.escapeHtml(p.name) + '</h3><p>' + ProductCatalog.escapeHtml(p.summary || '') + '</p>' + price + '</a>';
      }).join('');
    }).catch(() => { document.getElementById("product-list").innerHTML = '<p class="portfolio-status">드레스를 불러오지 못했어요. 잠시 후 다시 확인해 주세요.</p>'; });
  </script>
  <script type="module" src="lumino/app.js"></script>
</body>
</html>
